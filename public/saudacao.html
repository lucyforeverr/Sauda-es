<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudações</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1 id="mensagem"></h1>

    </div>

    <script>

        const saudacao =
            localStorage.getItem("saudacao");

        document.getElementById("mensagem")
            .innerText = saudacao;

    </script>

</body>

</html>
